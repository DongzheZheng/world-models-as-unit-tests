<title>World Models as Unit Tests</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column (the "ledger page"); figures and wide tables break out of it; small monospace
   labels and life pips carry the accounting motif of the experiment (every real episode is counted). */
:root {
  --bg: #f7f8fb; --surface: #ffffff; --ink: #141920; --muted: #586172; --rule: #dde2ea;
  --accent: #1d57c9; --good: #177a49; --bad: #c2362c; --code-bg: #edf0f6; --pip-off: #c9d0db;
  --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --measure: 43rem; --wide: 66rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --surface: #161a21; --ink: #e6e9ef; --muted: #9aa3b2; --rule: #2a303b;
    --accent: #86adff; --good: #62cf92; --bad: #ff8176; --code-bg: #1a202a; --pip-off: #3a4250; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a21; --ink: #e6e9ef; --muted: #9aa3b2; --rule: #2a303b;
  --accent: #86adff; --good: #62cf92; --bad: #ff8176; --code-bg: #1a202a; --pip-off: #3a4250; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 1.125rem; line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 2.5rem 5rem; -webkit-font-smoothing: antialiased; }
.post { max-width: var(--measure); margin-inline: auto; display: flex; flex-direction: column; gap: 1.15rem; }
.post > * { margin: 0; min-width: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; overflow-wrap: anywhere; }
a:focus-visible, summary:focus-visible, video:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
strong { font-weight: 600; }

/* ---- head */
.post-head { display: flex; flex-direction: column; gap: 0.9rem; padding-bottom: 1.2rem; border-bottom: 1px solid var(--rule); }
.kicker, .byline, .label { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-family: var(--sans); font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.08; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.dek { font-size: 1.28rem; line-height: 1.45; color: var(--muted); margin: 0; text-wrap: pretty; }
h2 { font-family: var(--sans); font-weight: 600; font-size: 1.55rem; line-height: 1.2; letter-spacing: -0.01em; margin: 1.6rem 0 0; text-wrap: balance; scroll-margin-top: 1rem; }
h3 { font-family: var(--sans); font-weight: 600; font-size: 1.15rem; line-height: 1.3; margin: 0.8rem 0 0; text-wrap: balance; }
h4 { font-family: var(--mono); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0.6rem 0 0; }
p, li { text-wrap: pretty; }
ul, ol { padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.35rem; }
hr { border: 0; border-top: 1px solid var(--rule); width: 100%; }

/* ---- the one-sentence thesis */
.lede { font-size: 1.3rem; line-height: 1.5; }
.pull { margin: 0.4rem 0; padding: 0.2rem 0 0.2rem 1.1rem; border-left: 3px solid var(--accent); font-size: 1.22rem; line-height: 1.5; }
.pull p { margin: 0; }

/* ---- table of contents */
.toc { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 1rem 1.2rem; display: flex; flex-direction: column; gap: 0.6rem; }
.toc ol { font-family: var(--sans); font-size: 0.98rem; line-height: 1.4; gap: 0.3rem; margin: 0; }
.toc a { color: var(--ink); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }

/* ---- figures (videos break out of the column) */
figure { margin: 0.6rem 0; display: flex; flex-direction: column; gap: 0.6rem; }
figure.wide { width: min(var(--wide), calc(100vw - 32px)); align-self: center; }
figure video, figure img { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--rule); background: #101319; }
figure.narrow video, figure.narrow img { max-width: 34rem; align-self: center; }
figcaption { font-family: var(--sans); font-size: 0.92rem; line-height: 1.5; color: var(--muted); max-width: var(--measure); align-self: center; width: 100%; }
figcaption strong { color: var(--ink); }
.media { position: relative; }
.media button { position: absolute; right: 0.6rem; bottom: 0.6rem; font: 600 0.72rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
  color: #fff; background: rgba(16, 19, 25, 0.72); border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 4px; padding: 0.3rem 0.55rem; cursor: pointer; }
.media button:hover { background: rgba(16, 19, 25, 0.9); }

/* ---- tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); }
.table-wrap.wide { width: min(var(--wide), calc(100vw - 32px)); align-self: center; }
table { border-collapse: collapse; width: 100%; font-family: var(--sans); font-size: 0.93rem; line-height: 1.4; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
thead th { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
tbody th { font-weight: 600; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.ours td, tr.ours th { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.good { color: var(--good); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; } .dim { color: var(--muted); }

/* ---- life pips: <span class="lives" data-n="5"></span>, optional data-of */
.lives { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 0.35rem; }
.lives i { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--ink); display: block; }
.lives i.off { background: var(--pip-off); }

/* ---- collapsible technical notes */
details.note { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 0 1.1rem; font-size: 1rem; }
details.note > summary { cursor: pointer; padding: 0.75rem 0; font-family: var(--sans); font-weight: 600; list-style: none; display: flex; gap: 0.6rem; align-items: baseline; }
details.note > summary::-webkit-details-marker { display: none; }
details.note > summary::before { content: "Note"; font: 600 0.68rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); flex: none; }
details.note > summary::after { content: "show ↓"; margin-left: auto; font: 400 0.72rem var(--mono); color: var(--muted); flex: none; }
details.note[open] > summary::after { content: "hide ↑"; }
details.note > .note-body { display: flex; flex-direction: column; gap: 0.8rem; padding: 0 0 1rem; border-top: 1px solid var(--rule); padding-top: 0.9rem; }
details.note > .note-body > * { margin: 0; min-width: 0; }

/* ---- code */
code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); padding: 0.08em 0.32em; border-radius: 3px; }
pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px; padding: 0.9rem 1rem; overflow-x: auto; font-size: 0.82rem; line-height: 1.55; }
pre code { background: none; padding: 0; font-size: inherit; }
pre .c { color: var(--muted); }

/* ---- footnotes, appendix, citation */
sup a { text-decoration: none; font-family: var(--sans); font-size: 0.75em; padding: 0 0.1em; }
.footnotes { font-size: 0.95rem; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
.footnotes ol { gap: 0.5rem; margin: 0; }
.footnotes li { color: var(--muted); }
.endmatter { font-size: 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
.endmatter > * { margin: 0; min-width: 0; }

/* ---- charts drawn from the probe data (inline SVG, coloured by the tokens) */
.chart { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.7rem; }
.curves { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 0.6rem 1rem; }
.chart svg { width: 100%; height: auto; display: block; }
.chart svg text { font-family: var(--sans); }
.chart .tt { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.chart .ts { font-size: 10.5px; fill: var(--muted); }
.chart .tk { font-size: 10px; fill: var(--muted); }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .cp { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.chart .cw { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart .dash { stroke-dasharray: 4 3; }
.chart .cpd { fill: var(--ink); }
.chart .cwd { fill: var(--accent); }
.chart .ship { fill: none; stroke: var(--bad); stroke-width: 1.7; }
.chart .mv { fill: var(--muted); opacity: 0.4; }
.chart .relay { fill: var(--good); }
.chart .crash { fill: none; stroke: var(--bad); stroke-width: 2; }
/* ---- overview: four steps as cards (wraps to 2 columns, then 1, on narrow screens) */
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.9rem; }
.flow .step { position: relative; background: var(--bg); border: 1px solid var(--rule); border-radius: 6px; padding: 0.8rem 0.85rem; display: flex; flex-direction: column; gap: 0.45rem; }
.flow .step .tag { font: 600 0.66rem var(--mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent); }
.flow .step h4 { font-family: var(--sans); font-size: 1rem; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0; }
.flow .step p { font-family: var(--sans); font-size: 0.86rem; line-height: 1.45; color: var(--muted); margin: 0; }
.flow .step:not(:last-child)::after { content: "\2192"; position: absolute; right: -0.82rem; top: 50%; transform: translateY(-50%); font: 400 0.85rem var(--sans); color: var(--muted); }
@media (max-width: 900px) { .flow { grid-template-columns: repeat(2, minmax(0, 1fr)); } .flow .step::after { display: none; } }
@media (max-width: 520px) { .flow { grid-template-columns: minmax(0, 1fr); } }
.legend { display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; font-family: var(--sans); font-size: 0.82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend i { display: inline-block; flex: none; }
.k-cp { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
.k-ship { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--bad); }
.k-cw { width: 9px; height: 9px; background: var(--accent); }
.k-mv { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.6; }
.k-relay { width: 9px; height: 9px; border-radius: 50%; background: var(--good); }
.k-line { width: 20px; border-top: 2px solid var(--ink); }
.k-line.cw { border-top-color: var(--accent); }
.k-line.dash { border-top-style: dashed; }

@media (max-width: 30rem) {
  body { font-size: 1.04rem; }
  .dek, .lede, .pull { font-size: 1.12rem; }
  h2 { font-size: 1.32rem; }
  th, td { padding: 0.45rem 0.55rem; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
